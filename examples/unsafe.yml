name: Unsafe synthetic example
on: pull_request_target
permissions: write-all
jobs:
  risky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: check title
        run: |
          echo "${{ github.event.pull_request.title }}"
          make test
