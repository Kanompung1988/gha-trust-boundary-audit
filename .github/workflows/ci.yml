name: Validate Agent Skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/unsafe.yml --format json --fail-on none > /tmp/audit-results.json
      - run: python -c 'import json; d=json.load(open("/tmp/audit-results.json")); assert any(x["rule"]=="GHA006" for x in d["findings"])'
